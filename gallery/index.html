<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <script>
    // Resolve the initial canvas before styles paint; white is the fallback.
    try {
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch { /* Keep the light HTML default when the system hint is unavailable. */ }
  </script>
  <title>Khech-Gallery</title>
  <meta name="description" content="Paintings by Arseniy Khechinashvili. Explore works, details and available paintings.">
  <link rel="canonical" href="https://khech.com/gallery/">
  <link rel="icon" href="/images/markup/favicon.ico">
  <meta property="og:title" content="Khech-Gallery">
  <meta property="og:description" content="Paintings by Arseniy Khechinashvili.">
  <meta property="og:url" content="https://khech.com/gallery/">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&amp;subset=cyrillic&amp;display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="/styles/khech-gallery.css">
  <script type="module" src="/scripts/khech-gallery.js"></script>
</head>
<body>
  <main id="gallery" class="gallery" aria-label="Галерея работ. Прокручивайте ленту; нажмите на картину, чтобы открыть её." tabindex="0">
    <div id="ribbon" class="ribbon"></div>
  </main>
  <div class="ribbon-edges" aria-hidden="true"></div>
  <span id="gallery-brand" aria-label="Khech">Khech.</span>
  <button id="theme-toggle" type="button" aria-label="Включить тёмный фон" aria-pressed="false"></button>
  <nav id="art-menu" aria-label="Gallery menu">
    <div class="menu-group">
      <button id="menu-filters" type="button" aria-expanded="false" aria-controls="filter-options">filters</button>
      <div id="filter-options" class="menu-options" hidden>
        <button type="button" data-filter="available" aria-pressed="false">available</button>
        <button type="button" data-filter="L" aria-pressed="true">large</button>
        <button type="button" data-filter="M" aria-pressed="true">medium</button>
        <button type="button" data-filter="S" aria-pressed="true">small</button>
      </div>
    </div>
    <div class="menu-group">
      <button id="menu-contacts" type="button" aria-expanded="false" aria-controls="contact-options">contacts</button>
      <div id="contact-options" class="menu-options" hidden>
        <button id="contact-email" type="button" aria-label="Copy email arsekh@gmail.com">arsekh@gmail.com</button>
        <a id="contact-telegram" href="https://t.me/khech" target="_blank" rel="noopener noreferrer">telegram</a>
        <a id="contact-instagram" href="https://www.instagram.com/khech_art/" target="_blank" rel="noopener noreferrer">instagram</a>
        <span id="menu-status" role="status" aria-live="polite"></span>
      </div>
    </div>
  </nav>
  <dialog id="viewer" aria-label="Просмотр картины">
    <img id="viewer-image" alt="" draggable="false">
    <section id="viewer-info" aria-label="Сведения о работе">
      <h2 id="viewer-title"></h2>
      <div id="viewer-meta"></div>
    </section>
    <nav id="viewer-views" aria-label="Ракурсы этой картины" hidden></nav>
  </dialog>
  <p id="gallery-error" role="alert" hidden>Не удалось загрузить работы. Обновите страницу.</p>
</body>
</html>
