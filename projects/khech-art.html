<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <link rel="icon" href="/images/markup/favicon.ico">
  <link rel="canonical" href="https://khech.com/projects/khech-art.html">

  <meta name="description" content="Khech Art — Selected works by Arseniy Khechinashvili">
  <meta name="author" content="Arseniy Khechinashvili">

  <meta property="og:site_name" content="Khech. Architecture, Design, Digital">
  <meta property="og:title" content="Khech Art">
  <meta property="og:description" content="Khech Art — Selected works by Arseniy Khechinashvili">
  <meta property="og:image" content="https://khech.com/images/preview/khech-art.jpg">
  <meta property="og:url" content="https://khech.com/projects/khech-art.html">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Khech Art">
  <meta name="twitter:description" content="Khech Art — Selected works by Arseniy Khechinashvili">
  <meta name="twitter:image" content="https://khech.com/images/preview/khech-art.jpg">

  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700;900&display=swap">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/styles/common.css">
  <link rel="stylesheet" href="/styles/top_project.css">

  <style>
    body {
      background: #000;
      color: #fff;
      overflow-x: hidden;
      font-family: 'Work Sans', sans-serif;
    }

    .project-page,
    .project-page * {
      color: #fff !important;
    }


    .art-works-animated {
      position: relative;
      width: min(100vw, 1100px);
      margin: 16px auto 120px auto;
      padding: 16px 0 120px;
      min-height: 500px;
      box-sizing: border-box;
    }

    .art-dim {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom,
          rgba(0, 0, 0, 0.65) 0%,
          rgba(0, 0, 0, 0.65) 60%,
          rgba(0, 0, 0, 0.0) 100%);
      opacity: 0;
      animation: dimFade 1.2s ease-out forwards;
      animation-delay: 1.35s;
      z-index: 4;
      pointer-events: none;
    }

    @keyframes dimFade {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .art-work-img {
      position: absolute;
      display: block;
      background: #111;
      box-shadow:
        0 4px 24px rgba(0, 0, 0, 0.5),
        14px 18px 4px rgba(0, 0, 0, 0.55);
      opacity: 0;
      animation-name: artFadeIn;
      animation-timing-function: ease-out;
      animation-fill-mode: forwards;
      animation-duration: 0.9s;
    }

    @keyframes artFadeIn {
      from {
        opacity: 0;
        transform: scale(0.96);
      }

      70% {
        opacity: 1;
        transform: scale(1.02);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .img4 {
      top: 15%;
      left: 19%;
      width: 30%;
      animation-delay: 1.20s;
      z-index: 1;
    }


    .img1 {
      top: 1%;
      left: 6%;
      width: 25%;
      animation-delay: 0.30s;
      z-index: 2;
    }

    .img2 {
      top: 10%;
      left: 40%;
      width: 25%;
      animation-delay: 0.60s;
      z-index: 3;
    }

    .img3 {
      top: 6%;
      left: 68%;
      width: 25%;
      animation-delay: 0.90s;
      z-index: 4;
    }


    .img7 {
      top: 44%;
      left: 30%;
      width: 15%;
      animation-delay: 1.50s;
      z-index: 5;
    }

    .img6 {
      top: 23%;
      left: 55%;
      width: 30%;
      animation-delay: 1.80s;
      z-index: 6;
    }

    .img5 {
      top: 30%;
      left: 52%;
      width: 15%;
      animation-delay: 2.10s;
      z-index: 7;
    }

    .img8 {
      top: 20%;
      left: 23%;
      width: 15%;
      animation-delay: 2.40s;
      z-index: 8;
    }

    .art-instagram-cta {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      opacity: 0;
      z-index: 10;
      animation: instagramFadeIn 0.9s ease-out forwards;
      animation-delay: 3.0s;
    }

    @keyframes instagramFadeIn {
      from {
        opacity: 0;
        transform: translate(-50%, -55%);
      }

      to {
        opacity: 1;
        transform: translate(-50%, -50%);
      }
    }

    .art-instagram-link {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: #fff;
    }

    .cta-label {
      font-weight: 400;
      font-size: clamp(16px, 3vw, 22px);
      text-shadow:
        0 0 5px rgba(0, 0, 0, 1),
        0 0 7px rgba(0, 0, 0, 1),
        0 0 10px rgba(0, 0, 0, 1),
        0 0 25px rgba(0, 0, 0, 1);

    }

    .cta-handle {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: clamp(26px, 5vw, 40px);
      text-shadow:
        0 0 5px rgba(0, 0, 0, 1),
        0 0 7px rgba(0, 0, 0, 1),
        0 0 10px rgba(0, 0, 0, 1),
        0 0 25px rgba(0, 0, 0, 1);
    }

    .cta-external-icon {
      width: clamp(16px, 3vw, 22px);
      height: auto;
      display: inline-block;
      filter: brightness(0) invert(1);
      margin-top: 2px;
    }

    @media (max-width: 786px) {

      #common_body {
        padding-left: var(--root-padding, 15px);
        padding-right: var(--root-padding, 15px);
        box-sizing: border-box;
      }

      .art-works-animated {
        width: 100%;
        margin: 0 auto 10px auto;
        padding: 0 0 20px 0;
        min-height: 400px;
      }

      .art-work-img {
        animation-duration: 0.48s;
      }

      .img1 {
        top: 1%;
        left: 6%;
        width: 25%;
        animation-delay: 0.30s;
        z-index: 2;
      }

      .img2 {
        top: 10%;
        left: 40%;
        width: 25%;
        animation-delay: 0.60s;
        z-index: 3;
      }

      .img3 {
        top: 6%;
        left: 68%;
        width: 25%;
        animation-delay: 0.90s;
        z-index: 4;
      }

      .img7 {
        top: 44%;
        left: 30%;
        width: 15%;
        animation-delay: 1.50s;
        z-index: 5;
      }

      .img6 {
        top: 23%;
        left: 55%;
        width: 30%;
        animation-delay: 1.80s;
        z-index: 6;
      }

      .img5 {
        top: 30%;
        left: 52%;
        width: 15%;
        animation-delay: 2.10s;
        z-index: 7;
      }

      .img8 {
        top: 20%;
        left: 23%;
        width: 15%;
        animation-delay: 2.40s;
        z-index: 8;
      }

      .art-instagram-cta {
        top: 24%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation-delay: 3.5s;
      }

      .cta-handle {
        font-size: clamp(22px, 6vw, 34px);
      }

      .cta-label {
        font-size: clamp(14px, 3.5vw, 18px);
      }
    }
  </style>

  <title>Khech. Art</title>
</head>

<body>
  <div id="common_body">

    <header class="page-header">
      <div class="page-header-title">
        <h1>Khech Art</h1>
        <h2>Selected Works</h2>
      </div>
      <nav class="page-header-nav">
        <h4><a href="/index.html" class="nav-link-main">Main</a></h4>
      </nav>
    </header>

    <div class="project-page">

      <section class="art-works-animated">

        <div class="art-dim"></div>

        <!-- изображения -->
        <img src="/images/content/khech-art/BLACK_MID.jpg" class="art-work-img img3" alt="Khech Art 1">
        <img src="/images/content/khech-art/RED_MID.jpg" class="art-work-img img2" alt="Khech Art 2">
        <img src="/images/content/khech-art/PINK_MID.jpg" class="art-work-img img1" alt="Khech Art 3">
        <img src="/images/content/khech-art/BLUE_BIG.jpg" class="art-work-img img4" alt="Khech Art Blue Big">
        <img src="/images/content/khech-art/BLUE_SMALL.jpg" class="art-work-img img5" alt="Khech Art Blue Small">
        <img src="/images/content/khech-art/RED_BIG.jpg" class="art-work-img img6" alt="Khech Art Red Big">
        <img src="/images/content/khech-art/RED_SMALL.jpg" class="art-work-img img7" alt="Khech Art Red Small">
        <img src="/images/content/khech-art/GOLD_SMALL.jpg" class="art-work-img img8" alt="Khech Art Gold Small">


        <!-- CTA -->
        <div class="art-instagram-cta">
          <a href="https://www.instagram.com/khech_art/" target="_blank" rel="noopener" class="art-instagram-link">
            <span class="cta-label">More on Instagram</span>
            <span class="cta-handle">
              @khech_art
              <img src="/images/markup/external.png" class="cta-external-icon" alt="">
            </span>
          </a>
        </div>

      </section>

    </div>

    <footer class="page-footer">
      <div class="page-footer-brand">
        <h3><a href="/index.html" class="logo-font">Khech.</a></h3>
      </div>
    </footer>

  </div>
</body>

</html>
